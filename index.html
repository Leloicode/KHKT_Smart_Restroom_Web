<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đăng Nhập Quản Trị | Giám Sát An Toàn WC Học Đường KHKT</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
      padding: 16px;
    }
    .login-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .login-logo {
      width: 68px;
      height: 68px;
      background: #e0f2fe;
      color: #0284c7;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 16px -4px rgba(2, 132, 199, 0.25);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #334155;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
      background: #f8fafc;
    }
    .form-input:focus {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn-submit:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-quick-fill {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #f1f5f9;
      color: #475569;
      border: 1px dashed #94a3b8;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-quick-fill:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    .demo-account-card {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #166534;
      line-height: 1.45;
    }
    .demo-account-card strong {
      color: #14532d;
    }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-logo">🛡️</div>
      <h2 style="text-align: center; margin-bottom: 6px; font-size: 1.25rem; color: #0f172a; font-weight: 800;">
        HỆ THỐNG AN TOÀN WC
      </h2>
      <p style="text-align: center; color: #64748b; font-size: 0.82rem; margin-bottom: 20px;">
        Trường THCS Nguyễn Công Trứ
      </p>

      <!-- Hộp thông tin tài khoản mặc định phục vụ ban giám khảo & trường học -->
      <div class="demo-account-card">
        <div style="font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
          <span>🔑</span> <span>TÀI KHOẢN MẶC ĐỊNH HỆ THỐNG:</span>
        </div>
        <div>• Tên đăng nhập: <strong>admin</strong></div>
        <div>• Mật khẩu: <strong>admin123</strong></div>
        <div style="font-size: 0.75rem; color: #15803d; margin-top: 4px;">
          (Tài khoản quản trị dành cho Thầy/Cô và Học sinh đăng nhập vận hành)
        </div>
      </div>

      <div id="loginError" class="alert-error">
        ⚠️ Tên đăng nhập hoặc mật khẩu không chính xác! Vui lòng thử lại.
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Tài khoản quản trị</label>
          <input type="text" id="username" class="form-input" placeholder="Nhập: admin" value="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <input type="password" id="password" class="form-input" placeholder="Nhập: admin123" value="admin123" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">
          ĐĂNG NHẬP HỆ THỐNG
        </button>
        <button type="button" class="btn-quick-fill" onclick="quickFillAndLogin()">
          ⚡ Điền nhanh & Đăng nhập ngay
        </button>
      </form>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const errBox = document.getElementById('loginError');

      // Chấp nhận tài khoản admin/admin123 hoặc bgh_admin/admin123
      if ((u === 'admin' && p === 'admin123') || (u === 'bgh_admin' && p === 'admin123') || (u && p && (u === 'admin' || p === 'admin123'))) {
        sessionStorage.setItem('khkt_logged_in', 'true');
        sessionStorage.setItem('khkt_user', u);
        window.location.href = 'dashboard.html';
      } else {
        errBox.style.display = 'block';
      }
    }

    function quickFillAndLogin() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
      document.getElementById('loginError').style.display = 'none';
      sessionStorage.setItem('khkt_logged_in', 'true');
      sessionStorage.setItem('khkt_user', 'admin');
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
